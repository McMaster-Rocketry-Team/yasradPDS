[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yasradPDS"
version = "0.1.0"
description = "SRAD parachute design system"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "rocketpy",
    "click>=8",
]

[project.scripts]
yasradPDS = "yasradPDS.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yasradPDS = ["config/defaults.json"]